<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JAY UNITED</title><meta name="theme-color" content="#0c2133"><link rel="icon" href="legacy/icon.svg">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5ef;font:16px/1.6 system-ui,sans-serif;color:#0c2133;padding:20px;box-sizing:border-box}
main{max-width:420px;text-align:center;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 8px 30px #0001}
a.btn{display:block;margin:12px 0;padding:14px;border-radius:14px;background:#0c2133;color:#fff;text-decoration:none;font-weight:700}a.sub{background:#e8efe9;color:#0c2133}small{color:#667}</style></head>
<body><main><h1>⚽ JAY UNITED</h1><p id="msg">JAY UNITED가 한 곳으로 합쳐졌어요. 잠시 후 이동해요…</p>
<a class="btn" id="go" href="https://jay-united-learning.justdog10.chatgpt.site/united/">JAY UNITED 열기</a>
<a class="btn sub" id="move" href="legacy/index.html" hidden>이 기기 기록 먼저 옮기기</a>
<small>같은 보호자 ChatGPT 계정으로 로그인하면 PC와 휴대폰 기록이 똑같이 이어져요.</small></main>
<script>
const CLOUD='https://jay-united-learning.justdog10.chatgpt.site';const target=CLOUD+'/united/'+location.hash;
document.getElementById('go').href=target;
navigator.serviceWorker?.getRegistrations?.().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
(async()=>{
 let local=false;
 if(localStorage.getItem('jay-cloud-migrated')!==CLOUD){try{local=(await indexedDB.databases()).some(d=>d.name==='jay-united-v1');}catch{local=true;}}
 if(local){document.getElementById('msg').textContent='이 기기에 아직 옮기지 않은 기록이 있어요. 먼저 옮긴 뒤 이어서 해요.';document.getElementById('move').hidden=false;return;}
 setTimeout(()=>location.replace(target),900);
})();
</script></body></html>
